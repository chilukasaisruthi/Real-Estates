```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Property Enquiry | Shruthi Estates</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->

    <nav>

        <div class="logo">
            🏠 Shruthi Estates
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="properties.html">Properties</a>
            <a href="about.html">About Us</a>
            <a href="services.html">Services</a>
            <a href="contact.html">Contact</a>
            <a href="enquiry.html">Enquiry</a>
        </div>

    </nav>


    <!-- Enquiry Section -->

    <section class="enquiry">

        <div class="enquiry-heading">

            <h1>Property Enquiry</h1>

            <p>
                Interested in a property?
                Send us your details and our team will contact you.
            </p>

        </div>


        <div class="enquiry-form">

            <form onsubmit="submitEnquiry(event)">

                <label>Your Name</label>

                <input
                    type="text"
                    id="enquiryName"
                    placeholder="Enter your name"
                    required
                >


                <label>Phone Number</label>

                <input
                    type="tel"
                    id="enquiryPhone"
                    placeholder="Enter your phone number"
                    required
                >


                <label>Email</label>

                <input
                    type="email"
                    id="enquiryEmail"
                    placeholder="Enter your email"
                    required
                >


                <label>Select Property</label>

                <select id="property" required>

                    <option value="">
                        -- Select Property --
                    </option>

                    <option value="Luxury Villa">
                        Luxury Villa - ₹85 Lakhs
                    </option>

                    <option value="Modern Apartment">
                        Modern Apartment - ₹55 Lakhs
                    </option>

                    <option value="Premium Family House">
                        Premium Family House - ₹1.2 Crores
                    </option>

                </select>


                <label>Message</label>

                <textarea
                    id="enquiryMessage"
                    rows="5"
                    placeholder="Write your requirements..."
                ></textarea>


                <button type="submit">
                    Submit Enquiry
                </button>

            </form>

        </div>

    </section>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 Shruthi Estates. All Rights Reserved.
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
```
